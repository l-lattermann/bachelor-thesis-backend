name: uois
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch=2.1
  - torchvision=0.16
  - pytorch-cuda=11.8
  - cudatoolkit
  - intel-openmp
  - numpy=1.26.4
  - pillow
  - matplotlib
  - scikit-image
  - opencv
  - jupyter
  - fastapi
  - uvicorn
  - pip
  - pip:
      - pypng
      - rich
      - uvicorn[standard]
      - plyfile
      - open3d
      - mayavi