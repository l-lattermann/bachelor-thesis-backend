name: uois
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # CUDA 12 kompatibel
  - pytorch=2.2
  - torchvision=0.17
  - pytorch-cuda=12.1

  - numpy=1.26.4
  - pillow
  - matplotlib
  - scikit-image
  - opencv
  - fastapi
  - uvicorn
  - pip

  - pip:
      - pypng
      - rich
      - plyfile