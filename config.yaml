project:
  name: bachelor_thesis_pipeline
  debug: true

network:
  orchestrator_url: http://orchestrator:8000
  rc_cube_service_url: http://rc_cube:8000
  sam_service_url: http://sam:8000
  contact_graspnet_service_url: http://contactgraspnet:8000
  llm_service_url: http://llm:8000

paths:
  output_debug: /shared/debug
  pipeline_file_share: /shared/pipeline_io
  rc_mock_cam_input: /shared/debug/rc_cube/rc_cube_mock_cam_output
  rc_mock_full_input: /shared/pipeline_io/rc_cube_output.npz

pipeline:
  mock_rc_cube_cam: false
  mock_rc_cube_full: false
  use_obj_selection: true

rc_cube:
  output_npz: /shared/pipeline_io/rc_cube_pointcloud.npz
  output_left_img: /shared/pipeline_io/left.png
  timeout_sec: 5.0
  max_message_size_mb: 300
  left_enabled: true
  right_enabled: false
  disparity_enabled: true
  disparity_error_enabled: false
  confidence_enabled: false
  mesh_enabled: false
  color: true

sam:
  device: cuda
  checkpoint: /app/checkpoints/sam2.1_l.pt
  output_npz: /shared/pipeline_io/sam_segmented_output.npz
  output_png: /shared/pipeline_io/sam_segmented_output.png

  min_area: 100
  max_area_ratio: 0.5



contact_graspnet:
  checkpoint_dir: /app/contact_graspnet/contact_graspnet/checkpoints/scene_test_2048_bs3_hor_sigma_001
  output_png: /shared/pipeline_io/cgn_annotated_output.png

  prediction:
    z_min: 0.0
    z_max: 2.0
    filter_grasps: true
    local_regions: true
    forward_passes: 1
    segmap_id: 4

  selection:
    num_grasps: 3
    top_score_candidates: 10
    gripper_width: 0.16
    k_means_clustering: true
    k_means:
      kmeans_n_init: 10
      kmeans_random_state: 0
      orientation_weight: 0.7

  gripper_projection:
    use_default_opening: false
    default_opening: 0.080
    gripper_line_width: 1
    number_line_width: 1

  camera:
    fallback_fx: 525.0
    fallback_fy: 525.0
    fallback_cx: null
    fallback_cy: null

llm:
  deployment: gpt-5.3-chat-global-standard
  max_completion_tokens: 1000

