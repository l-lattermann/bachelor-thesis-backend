services:
  rc_cube:
    build: ./services/rc_cube_service
    ports:
      - "8003:8000"
    volumes:
      - ./services/rc_cube_service:/app
      - ./shared/pipeline_io:/shared/pipeline_io
      - ./shared/debug:/shared/debug
      - ./config.yaml:/app/config.yaml:ro
    environment:
      RC_CUBE_IP: ${RC_CUBE_IP}
    restart: unless-stopped

  sam:
    build: ./services/sam_service
    ports:
      - "8005:8000"
    volumes:
      - ./services/sam_service:/app
      - ./shared/pipeline_io:/shared/pipeline_io
      - ./shared/debug:/shared/debug
      - ./config.yaml:/app/config.yaml:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    gpus: all
    restart: unless-stopped

  contactgraspnet:
    build: ./services/contactgraspnet_service
    ports:
      - "8002:8000"
    volumes:
      - ./services/contactgraspnet_service:/app
      - ./shared/pipeline_io:/shared/pipeline_io
      - ./shared/debug:/shared/debug
      - ./config.yaml:/app/config.yaml:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      QT_QPA_PLATFORM: "offscreen"
      PYTHONPATH: "/app"
      HOME: "/tmp"
    gpus: all
    restart: unless-stopped

  llm:
    build: ./services/llm_service
    ports:
      - "8004:8000"
    volumes:
      - ./services/llm_service:/app
      - ./config.yaml:/app/config.yaml:ro
      - ./shared/pipeline_io:/shared/pipeline_io
      - ./shared/debug:/shared/debug
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
    restart: unless-stopped

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    depends_on:
      - rc_cube
      - sam
      - contactgraspnet
      - llm
    volumes:
      - ./orchestrator:/app
      - ./shared/pipeline_io:/shared/pipeline_io
      - ./shared/debug:/shared/debug
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped